services:
  traefik:
    image: traefik:v3.0
    restart: always
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.apiversion=1.44"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@clofovoz.com"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_certs:/letsencrypt
    networks:
      - public_net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clofovoz_healtech}
      POSTGRES_USER: ${POSTGRES_USER:-clofovoz_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-C10f0V0z_HealTech_Secure2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - internal_net

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-clofovoz_admin}:${POSTGRES_PASSWORD:-C10f0V0z_HealTech_Secure2026!}@postgres:5432/${POSTGRES_DB:-clofovoz_healtech}
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - JWT_SECRET=${JWT_SECRET:-clofovoz_secret_key_2026}
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_public_net"
      - "traefik.http.routers.api.rule=Host(`api.clofovozhealtech.com`)"
      - "traefik.http.routers.api.entrypoints=web,websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    depends_on:
      - postgres
      - redis
    networks:
      - internal_net
      - public_net

  worker-ai:
    build:
      context: ..
      dockerfile: apps/worker-ai/Dockerfile
    restart: always
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER:-clofovoz_admin}:${POSTGRES_PASSWORD:-C10f0V0z_HealTech_Secure2026!}@postgres:5432/${POSTGRES_DB:-clofovoz_healtech}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
    depends_on:
      - postgres
      - redis
    networks:
      - internal_net

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=https://api.clofovozhealtech.com
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_public_net"
      - "traefik.http.routers.web.rule=Host(`clofovozhealtech.com`) || Host(`www.clofovozhealtech.com`)"
      - "traefik.http.routers.web.entrypoints=web,websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    depends_on:
      - api
    networks:
      - public_net

networks:
  public_net:
  internal_net:
    internal: true

volumes:
  postgres_data:
  redis_data:
  traefik_certs: